<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link rel="stylesheet" href="forms.css" />
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><a href="index.html">Index.</a></li>
          <li><a href="about.html">About.</a></li>
          <li><a href="forms.html">Forms.</a></li>
          <li><a href="menu.html">Menu.</a></li>
          <li><a href="gallery.html">Gallery.</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section>
        <h1>Contact Us</h1>
        <div>
          <!-- Beginning of the form element -->
          <form action="/submit" method="post">
            <!-- Label and text input field -->
            <label for="name">Name:</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your name"
            />
            <!-- Submit button -->
            <button type="submit">Submit</button>
            <br />

            <!-- Label and email input field -->
            <label for="email">Email:</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="example@example.com"
            />
            <br />
            <!-- Label and subject input field -->
            <label for="Subject">Subject:</label>
            <input
              type="text"
              id="Subject"
              name="Subject"
              placeholder="Enter the subject"
            />

            <br />

            <!-- Textarea for additional message -->
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="4" cols="60"></textarea>

            <br />
            <!-- Submit button to submit the form -->
            <input type="submit" value="Sunmit" />

            <!-- Reset button to reset the form fields -->
            <input type="reset" value="Reset" />

            <br />
          </form>
        </div>
        <footer>
          <address>
            <p>
              &copy; Copyright 2023 About Starbusks:
              <a href="https://about.starbucks.com/">Linkin</a>
            </p>
          </address>
        </footer>
      </section>
    </main>
  </body>
</html>
